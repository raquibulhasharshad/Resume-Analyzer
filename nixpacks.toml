# Nixpacks configuration for Railway deployment
providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r Backend/requirements.txt"
]

[start]
cmd = "cd Backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
